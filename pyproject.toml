[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-client"
version = "0.1.0"
description = "Platform-agnostic Muse gateway client library (Noise + WebSocket), with a QQ adapter."
requires-python = ">=3.11"
dependencies = ["cryptography"]

[tool.setuptools.packages.find]
include = ["muse_client*", "muse_bridge*"]
