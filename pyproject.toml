[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-im-bridge"
version = "0.1.0"
description = "Decoupled multi-platform bridge and proactive push service for Muse."
requires-python = ">=3.11"
dependencies = ["cryptography"]

[tool.setuptools.packages.find]
include = ["muse_bridge*"]
