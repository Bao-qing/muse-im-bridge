[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-im-bridge"
version = "0.1.0"
description = "Decoupled multi-platform bridge and proactive push service for Muse."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Bao-qing" }]
requires-python = ">=3.11"
keywords = ["muse", "qq", "onebot", "napcat", "bridge", "chatbot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "cryptography>=41.0.0",
    "httpx[http2]>=0.27.0",
    "websockets>=12.0",
    "qrcode>=8.0",
]

[project.urls]
Homepage = "https://github.com/Bao-qing/muse-im-bridge"
Issues = "https://github.com/Bao-qing/muse-im-bridge/issues"

[tool.setuptools.packages.find]
include = ["muse_bridge*"]
